<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Team Greggs Lab: Visual Test</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
            }
            body {
                background: white;
                cursor: pointer;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: system-ui, sans-serif;
            }

            #square {
                width: min(70vw, 70vh);
                aspect-ratio: 1;
                background: pink;
                transition: background-color 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 1rem;
                box-sizing: border-box;
                color: white;
            }
            p {
                font-size: 1.25rem;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4)
            }
        </style>
    </head>
    <body>
        <div id="square">
        <p>Click anywhere within the square cycle through sample colours (and let me know if they're okay!)</p>
        </div>
        <script>
            const colours = ["hotpink", "red", "green", "blue"];
            const square = document.getElementById("square");
            let index = 0;

            square.addEventListener("click", () => {
                index = (index + 1) % colours.length;
                square.style.backgroundColor = colours[index];
            });
            </script>
    </body>
</html>
