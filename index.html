<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Team Greggs Lab: Visual Test</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
            }
            body {
                background: skyblue;
                cursor: pointer;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: system-ui, sans-serif;
            }

            #square {
                width: min(70vw, 70vh);
                aspect-ratio: 1;
                background: dimgray;
                transition: background-color 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 1rem;
                box-sizing: border-box;
                color: white;
            }
            p {
                font-size: 1.25rem;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4)
            }
        </style>
    </head>
    <body>
        <div id="square">
        <p id="message">Click anywhere within the square to begin the Reaction Time Test.</p>
        </div>
        <script>
            const colours = ["hotpink", "red", "green", "blue"];
            const square = document.getElementById("square");
            const message = document.getElementById("message");
            let waiting = false;
            let started = false;
            const REPEATS = 5;
            let sequence = [];
            let step = 0;
            let finished = false;

            function buildSequence() {
                let list;
                do {
                    list = [];
                    for (const colour of colours) {
                        for (let i = 0; i < REPEATS; i ++) list.push(colour);
                    }
                    shuffle(list);
                } while (hasRepeats(list)); // Added this to re-shuffle the list if two colours appear consecutively.
                return list
            }

            function shuffle(list) {
                for (let i = list.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [list[i], list[j]] = [list[j], list[i]];
                }
            }

            function hasRepeats(list) {
                for (let i = 1; i < list.length; i++) {
                    if (list[i] === list[i - 1]) return true; // Added this to compare each value with the one before it in the shuffled list. buildSequence uses this to determine if it needs to re
                }
                return false;
            }

            function changeColour () {

                square.style.backgroundColor = sequence[step];
                step++;
            }

            function scheduleNext() {
                waiting = true;
                const delay = 500 + Math.random() * 3000;
                setTimeout(() => {
                    changeColour();
                    waiting = false;
                }, delay);
            }

            square.addEventListener("click", () => {
                if (waiting || finished) return; // Added this so that clicks are ignored if scheduleNext has already been called so spam-clicking doesn't queue a bunch of changes.

                if (!started) {
                    started = true;
                    sequence = buildSequence();
                    message.textContent = "Click anywhere within the square when you see a colour change."
                } else if (step === sequence.length) {
                    finished = true;
                    square.style.backgroundColor = "dimgray";
                    message.textContent = "Thanks for taking Team Greggs' reaction time test!";
                    return;
                }

                scheduleNext();
            });

            </script>
    </body>
</html>
