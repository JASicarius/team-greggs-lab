<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Team Greggs Lab: Visual Test</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
            }
            body {
                background: gray;
                cursor: pointer;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: system-ui, sans-serif;
            }

            #square {
                width: min(70vw, 70vh);
                aspect-ratio: 1;
                background: hotpink;
                transition: background-color 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 1rem;
                box-sizing: border-box;
                color: white;
            }
            p {
                font-size: 1.25rem;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4)
            }
        </style>
    </head>
    <body>
        <div id="square">
        <p>Click anywhere within the square cycle through sample colours (and let me know if they're okay!)</p>
        </div>
        <script>
            const colours = ["hotpink", "red", "green", "blue"];
            const square = document.getElementById("square");
            let current = 0;

            function changeColour () {
                let next;
                do {
                    next = Math.floor(Math.random() * colours.length);
                } while (next === current); // This should make it so the colours are random but never repeat consecutively so we get better data.

                current = next;
                square.style.backgroundColor = colours[current];
            }

            function scheduleNext() {
                const delay = 500 + Math.random() * 3000;
                setTimeout(() => {
                    changeColour();
                    scheduleNext();
                }, delay);
            }

scheduleNext();

            </script>
    </body>
</html>
